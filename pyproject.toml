[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "formal-security-verifier"
version = "0.2.0"
description = "Self-contained explicit-state and relational verification of security properties, with counterexamples"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Vincent Plessy" }]
dependencies = [
  "fastapi>=0.139,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.5,<3",
  "mypy>=1.20,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15,<1",
]

[project.scripts]
verify = "formal_security_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_security_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/ground-truth.json" = "formal_security_verifier/data/ground-truth.json"
"uv.lock" = "formal_security_verifier/data/uv.lock"
"web/app.js" = "formal_security_verifier/web/app.js"
"web/index.html" = "formal_security_verifier/web/index.html"
"web/style.css" = "formal_security_verifier/web/style.css"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/fixtures",
  "/web",
  "/scripts",
  "/benchmarks",
  "/docs",
  "/.github/workflows/ci.yml",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/Dockerfile",
  "/docker-compose.yml",
  "/Makefile",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["formal_security_verifier"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["formal_security_verifier"]
